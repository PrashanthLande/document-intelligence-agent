[project]
name = "document-intelligence-agent"
version = "0.1.0"
description = "An agentic document intelligence system for grounded question answering and source-level provenance."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Prashanth Lande" }
]
dependencies = [
    "chromadb>=1.5.9",
    "docling==2.130.0",
    "openai>=3.19.2",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
